<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼豆图生成器</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header__title">拼豆图生成器</div>
      <div class="header__sub">上传图片 → 量化配色 → 生成拼豆效果 → 下载 PNG / 配色清单</div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="card">
          <div class="card__title">1) 选择图片</div>
          <input id="file" type="file" accept="image/*" />
          <div id="fileHint" class="hint">建议使用清晰主体图；背景越干净效果越好。</div>
        </div>

        <div class="card">
          <div class="card__title">2) 参数</div>

          <label class="field">
            <div class="field__label">
              横向颗数（列）
              <span id="colsLabel" class="field__value"></span>
            </div>
            <input id="cols" type="range" min="20" max="200" step="1" value="80" />
          </label>

          <label class="field">
            <div class="field__label">
              预览颗粒大小
              <span id="beadSizeLabel" class="field__value"></span>
            </div>
            <input id="beadSize" type="range" min="6" max="24" step="1" value="12" />
          </label>

          <label class="field">
            <div class="field__label">配色</div>
            <div class="seg" role="tablist" aria-label="配色切换">
              <button class="seg__btn" type="button" data-palette="perler72" role="tab">Perler</button>
              <button class="seg__btn" type="button" data-palette="hama72" role="tab">Hama</button>
              <button class="seg__btn" type="button" data-palette="gray72" role="tab">灰度</button>
            </div>
            <select id="palette" class="select select--compact"></select>
          </label>

          <div class="row">
            <label class="check">
              <input id="dither" type="checkbox" checked />
              <span>抖动（更接近原图，但可能更花）</span>
            </label>
          </div>

          <div class="row">
            <label class="check">
              <input id="despeckle" type="checkbox" checked />
              <span>去彩点（减少人脸/皮肤彩色噪点）</span>
            </label>
          </div>

          <div class="row">
            <label class="check">
              <input id="cutout" type="checkbox" />
              <span>抠图（去背景）</span>
            </label>
          </div>
          <div id="cutoutPanel" class="subpanel" hidden>
            <label class="field">
              <div class="field__label">抠图方式</div>
              <select id="cutoutMode">
                <option value="simple">简单（背景较干净时效果最好）</option>
                <option value="smart">智能人像（需要联网加载模型）</option>
              </select>
            </label>

            <label class="field">
              <div class="field__label">
                简单模式阈值
                <span id="cutoutThresholdLabel" class="field__value"></span>
              </div>
              <input id="cutoutThreshold" type="range" min="10" max="120" step="1" value="45" />
            </label>

            <label class="field">
              <div class="field__label">背景填充</div>
              <select id="bgFill">
                <option value="keep">保留背景</option>
                <option value="black">黑</option>
                <option value="white">白</option>
              </select>
            </label>

            <div id="cutoutHint" class="hint"></div>
          </div>

          <div class="row">
            <label class="check">
              <input id="cartoon" type="checkbox" />
              <span>卡通化（先把真人照片变成卡通风格）</span>
            </label>
          </div>
          <div id="cartoonPanel" class="subpanel" hidden>
            <label class="field">
              <div class="field__label">
                平滑强度
                <span id="cartoonSmoothLabel" class="field__value"></span>
              </div>
              <input id="cartoonSmooth" type="range" min="0" max="5" step="1" value="2" />
            </label>
            <label class="field">
              <div class="field__label">
                色阶数（越小越卡通）
                <span id="cartoonLevelsLabel" class="field__value"></span>
              </div>
              <input id="cartoonLevels" type="range" min="3" max="16" step="1" value="8" />
            </label>
            <label class="field">
              <div class="field__label">
                边缘阈值
                <span id="cartoonEdgeLabel" class="field__value"></span>
              </div>
              <input id="cartoonEdge" type="range" min="10" max="220" step="1" value="75" />
            </label>
            <div class="hint">建议：人像先开卡通化，再根据肤色和彩点情况调抖动/去彩点。</div>
          </div>

          <div class="row">
            <label class="check">
              <input id="grid" type="checkbox" />
              <span>显示网格（辅助数格子）</span>
            </label>
          </div>

          <div class="row">
            <button id="render" class="btn btn--primary" disabled>生成 / 更新</button>
            <button id="downloadPng" class="btn" disabled>下载 PNG</button>
          </div>

          <div class="row">
            <button id="downloadCsv" class="btn" disabled>导出配色清单（CSV）</button>
          </div>

          <div class="divider"></div>

          <div class="row">
            <label class="check">
              <input id="printCoords" type="checkbox" checked />
              <span>打印版：坐标（行/列）</span>
            </label>
          </div>
          <div class="row">
            <label class="check">
              <input id="printNumbers" type="checkbox" checked />
              <span>打印版：格内编号（对应配色清单）</span>
            </label>
          </div>
          <div class="row">
            <button id="downloadPrintPng" class="btn" disabled>下载打印版 PNG（带网格/坐标/编号）</button>
          </div>

          <div id="stats" class="stats"></div>
        </div>

        <div class="card">
          <div class="card__title">3) 配色统计</div>
          <div id="legend" class="legend"></div>
        </div>
      </section>

      <section class="preview">
        <div class="preview__row">
          <div class="preview__title">原图预览（不缩略成格子）</div>
          <canvas id="srcCanvas" class="canvas canvas--preview"></canvas>
        </div>
        <div class="preview__row">
          <div class="preview__title">拼豆效果预览</div>
          <canvas id="outCanvas" class="canvas"></canvas>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div>提示：想要更“拼豆风”，把“横向颗数（列）”调小；想更细腻就调大。</div>
    </footer>
  </body>
</html>
